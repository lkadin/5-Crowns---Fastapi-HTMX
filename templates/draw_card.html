<style>
    /* Container: allow cards to wrap to next line instead of horizontal scrolling */
    .card-container {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 16px 0;
        padding: 8px;
        justify-content: center;
        align-items: flex-start;
    }

    .list-item {
        flex: 0 0 auto; /* don't shrink, keep intrinsic width */
        display: inline-flex;
        align-items: center;
    }

    /* Card sizing uses clamp for responsive scaling but tighter control for phones */
    .card {
        width: clamp(56px, 18vw, 110px);
        height: clamp(80px, 28vw, 160px);
        background: white;
        border: 2px solid #bfa76f;
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 8px;
        position: relative;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
        touch-action: manipulation; /* better touch behaviour */
        -webkit-tap-highlight-color: transparent;
    }

    .card.wild-card {
        border: 3px solid #d4a000;
        background-color: #fff8dc;
        box-shadow: 0 0 0 3px rgba(212, 160, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.12);
    }

    /* Make cards pop slightly on touch/hover */
    .card:active,
    .card:focus,
    .card:hover {
        transform: translateY(-4px) scale(1.02);
        box-shadow: 0 10px 24px rgba(0,0,0,0.18);
    }

    /* Ensure buttons wrapping cards are full-size and touch-friendly */
    .card button,
    .list-item > button {
        background: transparent;
        border: none;
        padding: 0;
        margin: 0;
        display: inline-block;
        cursor: pointer;
        width: 100%;
        height: 100%;
    }

    .top-left,
    .bottom-right {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        font-size: 0.95em;
        position: absolute;
    }

    .top-left { top: 8px; left: 8px; }
    .bottom-right { bottom: 8px; right: 8px; transform: rotate(180deg); }

    .middle {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
        pointer-events: none; /* allow touches to pass through to button */
    }

    .suit.large { font-size: 2.2em; }
    .rank { font-weight: 700; font-size: 1.05em; }

    .sort-cards-action {
        margin-bottom: 8px;
        text-align: center;
    }

    .sort-cards-action button {
        background-color: #4CAF50;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1em;
    }

    .discard-instruction {
        margin: 0 0 8px;
        color: #666;
        font-weight: 600;
        text-align: center;
    }

    .long-press-card {
        position: relative;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }

    .long-press-card.is-long-pressing {
        animation: discard-long-press 700ms linear forwards;
        box-shadow: inset 0 0 0 4px #dc3545, 0 10px 24px rgba(0, 0, 0, 0.18);
        transform: translateY(-4px) scale(1.02);
    }

    @keyframes discard-long-press {
        from { opacity: 1; }
        to { opacity: 0.65; }
    }

    /* Suit colors */
    .suit.spade, .suit.large.spade, .rank.spade { color: black; }
    .suit.heart, .suit.large.heart, .rank.heart { color: red; }
    .suit.diamond, .suit.large.diamond, .rank.diamond { color: #0056b3; }
    .suit.club, .suit.large.club, .rank.club { color: #0b7a07; }
    .suit.star, .suit.large.star, .rank.star { color: #BA8E23; }
    .suit.joker, .suit.large.joker, .rank.joker { color: #2a7b2a; }

    /* Small screens: increase readable sizes and tighten layout */
    @media (max-width: 520px) {
        .card-container { gap: 10px; padding: 6px; }
        .card { width: clamp(64px, 24vw, 90px); height: clamp(96px, 32vw, 150px); border-radius: 10px; padding: 10px; }
        .suit.large { font-size: 2.6em; }
        .rank { font-size: 1.15em; }
    }

    /* Very small phones: adjust card sizes for better fit */
    @media (max-width: 380px) {
        .card { width: 72px; height: 110px; }
        .middle { height: 100%; }
        .suit.large { font-size: 2.8em; }
        .rank { font-size: 1.2em; }
    }
</style>
<div class="image-fluid"></div>
{% if sort_action %}
<div class="sort-cards-action">
    <button {% if sort_action.action_status.value == "disabled" and not checkbox_required %}hidden{% endif %}
        hx-post="/web/{{room_id}}/{{user_id}}/{{sort_action.name}}" class="action-button">Sort Cards</button>
</div>
{% endif %}
{% if checkbox_required %}
<p class="discard-instruction">Long press a card to discard</p>
<div class="card-container" id="listForSorting" hx-on::load="initSortable()">
    {% for card in cards %}
    <div class="list-item" id={{ loop.index }}> <button type="button"
        class="long-press-card"
        hx-ws="send"
        hx-trigger="discard-long-press"
        hx-vals='{"cardnames": "{{card.suit.value}}-{{card.rank}}"}'>
        {% include './one_card.html' %}
        </button>
    </div>
    {% endfor %}
</div>
<script>
    (function initLongPressDiscard() {
        const holdDuration = 700;
        document.querySelectorAll('.long-press-card').forEach(function (button) {
            let holdTimer = null;
            let completed = false;
            let startX = 0;
            let startY = 0;

            function clearHold() {
                window.clearTimeout(holdTimer);
                holdTimer = null;
                button.classList.remove('is-long-pressing');
            }

            button.addEventListener('pointerdown', function (event) {
                if (event.pointerType === 'mouse' && event.button !== 0) {
                    return;
                }
                completed = false;
                startX = event.clientX;
                startY = event.clientY;
                button.classList.add('is-long-pressing');
                holdTimer = window.setTimeout(function () {
                    completed = true;
                    clearHold();
                    button.dispatchEvent(new CustomEvent('discard-long-press', {
                        bubbles: true
                    }));
                }, holdDuration);
            });

            button.addEventListener('pointermove', function (event) {
                if (holdTimer !== null
                    && Math.hypot(event.clientX - startX, event.clientY - startY) > 10) {
                    clearHold();
                }
            });
            button.addEventListener('pointerup', clearHold);
            button.addEventListener('pointercancel', clearHold);
            button.addEventListener('pointerleave', function (event) {
                if (!completed) {
                    clearHold();
                }
            });
            button.addEventListener('contextmenu', function (event) {
                event.preventDefault();
            });
            button.addEventListener('keydown', function (event) {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    if (holdTimer === null) {
                        completed = false;
                        button.classList.add('is-long-pressing');
                        holdTimer = window.setTimeout(function () {
                            completed = true;
                            clearHold();
                            button.dispatchEvent(new CustomEvent('discard-long-press', {
                                bubbles: true
                            }));
                        }, holdDuration);
                    }
                }
            });
            button.addEventListener('keyup', function (event) {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    clearHold();
                }
            });
        });
    })();
</script>
{% else %}
<div class="card-container" id="listForSorting" hx-on::load="initSortable()">
    {% for card in cards %}
    <div class="list-item" id={{ loop.index }}>
        {% include './one_card.html' %}
    </div>
    {% endfor %}
</div>
{% endif %}
